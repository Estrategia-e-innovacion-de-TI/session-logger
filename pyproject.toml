[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-session-logger"
version = "0.1.0"
description = "GitHub Copilot hook logger for prompts, tool use, and session telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ARQUITECTURA INNOVACION TI" }
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
copilot-session-logger = "copilot_session_logger.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

