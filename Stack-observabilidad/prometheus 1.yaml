global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: marvin
    namespace: bancolombia

# Scrape config for Prometheus itself
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'marvin-metrics'
    static_configs:
      - targets: ['otel-collector:8889']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'marvin_.*'
        action: keep

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
