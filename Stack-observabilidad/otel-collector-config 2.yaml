# OpenTelemetry Collector Configuration
# Generic configuration for all Marvin agents (backend-core, code-review, future agents)

receivers:
  # OTLP receiver for traces, metrics, and logs via gRPC and HTTP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # Derive RED-style metrics from traces so Prometheus has useful metrics
  # even if clients send only traces/logs.
  spanmetrics: {}

processors:
  # Batch processor to reduce the number of requests
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  
  # Add resource attributes for all services
  resource:
    attributes:
      - key: service.namespace
        value: marvin
        action: insert

  # Promote log record attributes to Loki stream labels
  # Without this, Loki puts all logs in one stream and label-based filtering is slow
  resource/loki_labels:
    attributes:
      - key: loki.attribute.labels
        value: context_id,task_id,thread_id
        action: insert

exporters:
  # Export traces to Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  
  # Export metrics to Prometheus (via scraping endpoint)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: marvin
  
  # Export logs to Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
  
  # Logging exporter for debugging (optional)
  logging:
    loglevel: info

service:
  pipelines:
    # Traces pipeline: OTLP -> Batch -> Tempo
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/tempo, spanmetrics, logging]
    
    # Metrics pipeline: OTLP -> Batch -> Prometheus
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]
    
    # Logs pipeline: OTLP -> Batch -> Loki
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, resource/loki_labels]
      exporters: [loki, logging]
